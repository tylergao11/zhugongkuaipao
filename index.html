<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="screen-orientation" content="landscape">
  <title>主公快跑 · 刘备长坂坡</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="assets/game/camp-ui.css">
  <link rel="stylesheet" href="assets/game/battle-ui.css">
  <link rel="stylesheet" href="assets/game/battle-popup.css">
  <link rel="stylesheet" href="assets/game/loading-ui.css">
  <link rel="stylesheet" href="assets/game/typography.css">
  <link rel="preload" as="image" href="assets/game/camp-home-v2.webp">
  <link rel="preload" as="image" href="assets/game/changban-preview-v1.webp">
  <link rel="modulepreload" href="engine.js">
  <link rel="modulepreload" href="animation.js">
</head>
<body>
<div id="safe-area" aria-hidden="true"></div>
<main id="game" aria-label="主公快跑，三层十八格塔防游戏">
  <div id="battle-viewport" aria-label="可拖动的古城战场"><div id="battle-world">
    <canvas id="scene" width="1440" height="810" aria-label="长坂坡，刘备沿村口、长坂桥、山道三层逃跑"></canvas>
    <div id="slots" aria-label="十八个驻守格"></div>
  </div></div>
  <header class="hud">
    <h1>主公<span>快跑</span><small>刘备主题 · 长坂坡</small></h1>
    <div class="progress-box"><div class="progress-label"><span id="escape-label">护送刘备抵达出口</span><span id="progress-text">0%</span></div><div class="track"><div id="progress-fill"></div><span id="liu-marker" class="liu-marker" hidden title="刘备位置">刘</span><span id="chase-marker" class="chase-marker" hidden title="最近追兵">追</span><span id="caocao-marker" class="caocao-marker" hidden title="曹操位置">曹</span><span class="goal-flag">⚑</span></div></div>
    <div class="hud-actions"><button id="haptics" class="square active" aria-label="关闭震感" title="震感">震</button><button id="sound" class="square active" aria-label="关闭音乐与音效" aria-pressed="true" title="音乐与音效">♫</button><button id="battle-speed" class="square" aria-label="当前正常速度，切换 2 倍速" aria-pressed="false" title="开启 2 倍速">1×</button></div>
  </header>
  <div class="battle-readout"><span id="kill-count">击退 0</span><span id="enemy-count">追兵 0</span><span id="oil-hint" hidden>的卢 · 就绪</span></div>
  <div id="impact-flash" aria-hidden="true"></div>
  <div id="gate-danger" aria-hidden="true" hidden></div>
  <div id="boss-pressure" aria-hidden="true" hidden></div>
  <aside id="boss-status" hidden aria-label="敌将生命"><strong id="boss-name"></strong><progress id="boss-health" max="1" value="1" aria-label="BOSS 剩余生命"></progress></aside>
  <aside id="bite-hint" hidden aria-label="追兵距离">追兵 · 贴身 — 格</aside>
  <div id="gate-warning" role="alert" hidden><strong>警报 · 登岸口已开</strong><span>增援上岸 · 主公被押至登岸口即失败</span></div>
  <div id="skill-banner" hidden role="status"></div>
  <nav class="view-tools" aria-label="战场视角"><button id="battle-pause" disabled>暂停</button><button id="view-gate" hidden>⚠ 登岸口</button><button id="zoom-view">放大</button></nav>
  <nav id="mechanism-tools" aria-label="关卡机关"></nav>
  <button id="liu-indicator" hidden aria-label="主公在画面外，点击跟随主公" title="点击跟随主公"><span class="liu-pointer" aria-hidden="true"></span><span class="liu-pointer-label" aria-hidden="true">主公</span></button>
  <aside id="unit-menu" hidden aria-label="驻守单位操作">
    <span id="unit-name"></span><button id="unit-turn" hidden>转向</button><button id="unit-swap" hidden>邻位换防</button><button id="unit-upgrade" class="is-upgrade">升级</button><button id="dismantle">拆卸</button><button id="close-unit" aria-label="关闭菜单">×</button>
  </aside>
  <div id="drag-preview" hidden aria-hidden="true"><canvas id="drag-icon" width="256" height="256"></canvas></div>
  <div id="toast" role="status"></div>
  <footer class="toolbar"><div class="purse"><span class="supply-icon" aria-hidden="true"></span><strong id="gold"></strong><small>军饷</small></div><div id="cards" aria-label="本次出征的武将与器械，最多六张"></div></footer>
  <section id="overlay" class="overlay loading-only" data-mode="ready">
    <section id="battle-popup" hidden role="dialog" aria-modal="true" aria-labelledby="battle-popup-title"></section>
    <div class="boot-loader" aria-label="正在加载">
      <div id="load-status" role="status">0%</div>
      <progress id="load-progress" max="100" value="0" aria-label="场景与音乐加载进度"></progress>
      <button id="start" disabled>准备中…</button>
    </div>
  </section>
  <section id="camp" class="overlay" hidden aria-label="长坂大营，出征编队与宝箱库房"></section>
</main>
<noscript>请启用 JavaScript 后开始游戏。</noscript>
<script type="module" src="main.js"></script>
</body>
</html>
